name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test tests/AllInOne.Tests/AllInOne.Tests.csproj -c Release

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      # Версия берётся из тега: v0.2.0 → 0.2.0. All in One сравнивает её с релизами при самообновлении.
      - name: Publish and build installers
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          foreach ($flavor in 'net9', 'standalone') {
            # Варианты делят obj: без очистки второй publish переиспользует файлы первого
            # и standalone выходит без рантайма.
            Remove-Item -Recurse -Force src/AllInOne.Host/obj, src/AllInOne.Host/bin -ErrorAction SilentlyContinue
            dotnet publish src/AllInOne.Host/AllInOne.Host.csproj -c Release `
              -p:AllInOneFlavor=$flavor -p:Version=$version -o "publish/$flavor"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $env:ISCC /Qp "/DAppVersion=$version" "/DFlavor=$flavor" installer/AllInOne.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "All in One ${{ github.ref_name }}"
          body: |
            Установщик, один из двух:
            - **AllInOne-…-setup-net9.exe** — нужен .NET 9 Desktop Runtime;
            - **AllInOne-…-setup-standalone.exe** — .NET внутри.
            Установленный All in One обновляется сам («Обновления» → «Обновить»), запущенные модули при этом не останавливаются.
          files: artifacts/AllInOne-*-setup-*.exe
