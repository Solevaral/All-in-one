name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build AllInOne.sln -c Release

      - name: Test
        run: dotnet test tests/AllInOne.Tests/AllInOne.Tests.csproj -c Release --no-build
